name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

# Superseded PR validation must not hold runner capacity.
concurrency:
  group: pr-ci-build-test.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: SatoshiAndKin/codecov-python/.github/workflows/build-test-reviewed-linux.yml@e77d451935a8e73633f7a7a13931e02a4c1e4730
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
